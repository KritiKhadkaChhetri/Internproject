<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart | Ecommerce</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="brand">Ecommerce <span class="divider">|</span> Shop Now</a>

    <nav class="nav-links">
      <a href="products.html" class="nav-item">
        <span class="badge" id="badge">0</span>
        products
      </a>
      <a href="login.html" class="nav-item">Login</a>
      <a href="cart.html" class="nav-item cart">
        Cart
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM1 2v2h2l3.6 7.59-1.35 2.45A2 2 0 0 0 7 17h12v-2H7.42a.25.25 0 0 1-.22-.37L8.1 13h7.45a2 2 0 0 0 1.75-1.03l3.58-6.49A1 1 0 0 0 20 4H5.21l-.94-2H1zm16 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
        </svg>
      </a>
    </nav>
  </header>

  <main class="cart-page">
    <h1 class="cart-title">Your Cart</h1>

    <div id="cartItems" class="cart-list"></div>

    <div id="cartEmpty" class="cart-empty" hidden>
      <p>Your cart is empty.</p>
      <a href="products.html" class="cta-link">Continue shopping</a>
    </div>

    <section id="cartSummary" class="summary" hidden>
      <hr class="summary-line" />
      <div class="summary-box">
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal"></span></div>
        <div class="summary-row"><span>VAT</span><span id="sumVat"></span></div>
        <div class="summary-row"><span>Discount</span><span id="sumDiscount"></span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal"></span></div>

        <span class="discount-pill" id="discountPill">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8z"/>
            <path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M14 7v10" stroke-dasharray="2 2.5"/>
          </svg>
          <span id="discountText"></span>
        </span>

        <button class="checkout-btn" id="checkoutBtn" type="button">Checkout</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="cart.js"></script>
</body>
</html>
